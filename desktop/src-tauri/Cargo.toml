[package]
name = "shift-schedule-desktop"
version = "1.0.0"
description = "Workhorse"
authors = ["华文达"]
edition = "2021"
rust-version = "1.77.2"

# 库与可执行文件名保持一致，Cargo 惯例。
[lib]
name = "shift_schedule_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# 备份导出 / 导入需要落盘与文件选择器。
# 静态版靠 <a download> + <input type=file>，壳里这两条路都被
# WebView2 的下载策略挡掉，必须换成 Tauri 的原生对话框。
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# JIG 数据页要读系统剪贴板：从邮件正文里自动挑出 Jig ID。
# WebView2 里 navigator.clipboard.readText 在 onPaste 事件中基本必被拒
# （需要额外的用户激活与权限），只有插件能拿到真正的系统剪贴板。
tauri-plugin-clipboard-manager = "2"

# 单实例：双击第二次不再开新进程，而是把已有窗口唤回前台。
tauri-plugin-single-instance = "2"

# 原生标题栏跟着前端主题换色：DWM 的 caption / text / border 颜色 API。
# 只影响 Windows 窗口装饰；WebView 自己的主题由 window.set_theme 单独同步。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
# 排班表是个纯本地小工具，启动速度比二进制体积重要。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
