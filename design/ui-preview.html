<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>昼夜 · 重新设计样张</title>
<style>
  :root{
    --shell:#171512; --shell-line:#2C2822; --shell-text:#F4EFE5; --shell-muted:#A69C8A;
    --canvas:#EDE8DE; --paper:#FAF7F0;
    --ink:#191713; --ink2:#4A453C; --ink3:#7D766A; --rule:#DFD8CA;
    --accent:#B0392B; --accent-weak:#F4E4DE;
    --day-bg:#D9E5EA; --day-ink:#234A5A;
    --night-bg:#20262E; --night-ink:#F2EFE8;
    --rest-bg:#DCE4D6; --rest-ink:#33503A;
    --dayx-bg:#EFDFC1; --dayx-ink:#6B4A1B;
    --nightx-bg:#E7CDC1; --nightx-ink:#6B3524;
    --leave-bg:#E4DFD4; --leave-ink:#514C42;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    --serif:"Songti SC","Noto Serif SC","SimSun",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#D7D1C5;color:var(--ink);padding:26px 22px 48px;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .head{max-width:1220px;margin:0 auto 20px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
  .head h1{font-family:var(--serif);font-size:23px;letter-spacing:.05em}
  .head p{margin-top:8px;color:#5B554A;font-size:12px;line-height:1.75;max-width:780px}
  .head .meta{font-family:var(--mono);font-size:10px;color:#7C766A;letter-spacing:.1em;white-space:nowrap}
  .row{display:flex;gap:26px;overflow-x:auto;padding:6px 4px 20px;max-width:1240px;margin:0 auto}
  .item{flex:0 0 auto}
  .label{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  .label b{font-family:var(--serif);font-size:15px}
  .label span{font-size:10px;color:#7C766A}

  .phone{width:375px;height:812px;border-radius:30px;overflow:hidden;background:var(--canvas);
    position:relative;box-shadow:0 16px 40px rgba(30,26,20,.16),0 0 0 1px rgba(30,26,20,.08)}
  .status{height:44px;background:var(--shell);color:var(--shell-muted);display:flex;align-items:center;
    justify-content:space-between;padding:0 22px;font-family:var(--mono);font-size:11px;position:relative}
  .status i{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:96px;height:26px;
    background:#070605;border-radius:999px;display:block}
  .nav{height:44px;background:var(--shell);display:flex;align-items:center;justify-content:space-between;
    padding:0 16px 0 20px;border-bottom:1px solid var(--shell-line)}
  .brand{font-family:var(--serif);color:var(--shell-text);font-size:18px;letter-spacing:.14em}
  .nav-action{color:var(--shell-muted);font-size:11px;letter-spacing:.06em}
  .page{position:absolute;top:89px;left:0;right:0;bottom:0;padding-bottom:76px;overflow:hidden}
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;padding-bottom:14px;background:var(--shell);
    border-top:1px solid var(--shell-line);display:flex}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    color:#867E6F;font-size:9px}
  .tab.on{color:#E8C58B}
  .glyph{width:16px;height:16px;position:relative;color:currentColor}
  .g-cal{border:1px solid currentColor;border-radius:2px}
  .g-cal::before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:currentColor}
  .g-matrix{display:flex;flex-wrap:wrap;gap:4px}
  .g-matrix i{width:6px;height:6px;border:1px solid currentColor;border-radius:1px}
  .g-set{display:flex;flex-direction:column;gap:4px;justify-content:center}
  .g-set i{height:1px;background:currentColor}
  .g-set i:nth-child(1){width:16px}.g-set i:nth-child(2){width:11px}.g-set i:nth-child(3){width:7px}

  /* ---------------- 日历 ---------------- */
  .cal{padding:0 16px}
  .month{display:flex;align-items:center;justify-content:center;gap:12px;padding-top:16px}
  .month b{font-family:var(--serif);font-size:20px;letter-spacing:.03em}
  .month .step{color:var(--ink3);font-size:15px;width:24px;text-align:center}
  .range{margin-top:3px;text-align:center;font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.06em}
  .today{margin-top:12px;background:var(--ink);color:#F6F1E7;border-radius:6px;padding:14px 16px;position:relative}
  .today::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--accent)}
  .t-label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:#A09A8D;letter-spacing:.04em}
  .t-main{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
  .t-shift{font-family:var(--serif);font-size:34px;letter-spacing:.04em;line-height:1.1}
  .t-chip{font-family:var(--mono);font-size:9px;padding:3px 7px;border-radius:2px;background:var(--accent);color:#F8F3E8}
  .t-foot{margin-top:12px;padding-top:10px;border-top:1px solid #35302A;font-family:var(--mono);font-size:9px;color:#A09A8D}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:12px 0 4px}
  .weekdays span{text-align:center;font-size:9px;color:var(--ink3);letter-spacing:.18em}
  .grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cell{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
  .num{font-family:var(--mono);font-size:13px;color:var(--ink2)}
  .cell.out .num,.cell.out .sq{opacity:.3}
  .cell.today .num{width:21px;height:21px;background:var(--accent);color:#F8F3E8;display:flex;
    align-items:center;justify-content:center;border-radius:2px;font-weight:600}
  .sq{width:18px;height:18px;border-radius:2px;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700}
  .sq.t-day{background:var(--day-bg);color:var(--day-ink)}
  .sq.t-night{background:var(--night-bg);color:var(--night-ink)}
  .sq.t-rest{background:var(--rest-bg);color:var(--rest-ink)}
  .sq.t-dayx{background:var(--dayx-bg);color:var(--dayx-ink)}
  .sq.t-nightx{background:var(--nightx-bg);color:var(--nightx-ink)}
  .sq.t-leave{background:var(--leave-bg);color:var(--leave-ink)}
  .ot{position:absolute;top:2px;right:2px;font-family:var(--mono);font-size:8px;color:var(--accent)}
  .foot{margin-top:10px;border-top:1px solid var(--rule);padding-top:10px}
  .legend{display:flex;gap:10px}
  .lg{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ink3)}
  .lg i{width:8px;height:8px;border-radius:1px;display:block}
  .stats{display:flex;margin-top:8px}
  .stat{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px}
  .stat b{font-family:var(--mono);font-size:16px}
  .stat span{font-size:9px;color:var(--ink3)}
  .stat+.stat{border-left:1px solid var(--rule)}

  /* ---------------- 矩阵 ---------------- */
  .mx{padding:0 16px}
  .mx-sum{display:flex;padding:14px 0;border-bottom:1px solid var(--rule)}
  .mx-sum div{flex:1;text-align:center}
  .mx-sum b{font-family:var(--mono);font-size:17px;display:block}
  .mx-sum span{font-size:9px;color:var(--ink3)}
  .mx-body{display:flex}
  .names{flex:0 0 148px;border-right:1px solid var(--ink3)}
  .nm-head{height:30px}
  .nm{height:46px;padding:5px 8px 5px 0;border-bottom:1px solid var(--rule);display:flex;
    flex-direction:column;justify-content:center;gap:1px}
  .nm b{font-size:12px;font-weight:600}
  .nm span{font-family:var(--mono);font-size:8px;color:var(--ink3)}
  .self{display:inline-block;margin-left:4px;font-size:8px;color:var(--accent);border:1px solid var(--accent);
    border-radius:2px;padding:0 3px;vertical-align:1px}
  .days{flex:1;overflow:hidden;position:relative}
  .d-inner{width:744px;margin-left:-132px}
  .d-head{display:flex;height:30px;border-bottom:1px solid var(--rule)}
  .d-cell{flex:0 0 24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .d-cell span{font-family:var(--mono);font-size:8px;color:var(--ink3);line-height:1.25}
  .d-cell.today{background:var(--accent-weak)}
  .d-cell.today span:first-child{color:var(--accent);font-weight:700}
  .d-row{display:flex;height:46px;border-bottom:1px solid var(--rule)}
  .pill-cell{flex:0 0 24px;display:flex;align-items:center;justify-content:center}
  .pill{width:16px;height:16px;border-radius:2px;display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:700}
  .fade{position:absolute;top:0;right:0;bottom:0;width:20px;
    background:linear-gradient(to left,var(--canvas),rgba(237,232,222,0))}

  /* ---------------- 设置 ---------------- */
  .st{padding:0 16px}
  .me{margin-top:14px;background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent);
    border-radius:4px;padding:14px;display:flex;align-items:center;gap:12px}
  .mono-badge{width:38px;height:38px;border:1px solid var(--ink);display:flex;align-items:center;
    justify-content:center;font-family:var(--serif);font-size:19px;flex:0 0 auto}
  .me .n{font-family:var(--serif);font-size:21px;line-height:1.1;letter-spacing:.03em}
  .me .s{font-family:var(--mono);font-size:9px;color:var(--ink3);margin-top:4px}
  .group{margin-top:24px}
  .g-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .g-title{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ink3)}
  .g-note{font-family:var(--mono);font-size:8px;color:var(--ink3)}
  .rows{border-top:1px solid var(--rule)}
  .row2{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 0;border-bottom:1px solid var(--rule)}
  .r-main{display:flex;flex-direction:column;gap:2px}
  .r-title{font-size:13px}
  .r-sub{font-family:var(--mono);font-size:8px;color:var(--ink3)}
  .r-arrow{color:var(--ink3);font-size:12px}
  .r-value{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .r-title.danger{color:var(--accent)}
</style>
</head>
<body>
  <div class="head">
    <div>
      <h1>昼夜 · 「历书」</h1>
      <p>布局不动，只换视觉语言：暖纸 + 墨黑 + 朱红；品牌用衬线，数字全部等宽；去掉圆角与投影，靠发丝线和留白分层。班次从「大面积色块」退回「小方印」，让日历先像一张历书，再像排班表。</p>
    </div>
    <div class="meta">EDITORIAL / MONO NUMERALS / NO SHADOW</div>
  </div>
  <div class="row" id="row"></div>
  <script src="ui-preview.js"></script>
</body>
</html>
