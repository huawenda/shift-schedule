<!-- 昼夜 · 应用图标母版（八刻度仪表）
     512 网格：纯色底板 #1A2125（圆角 88），钢灰 #C9D3D9，机械橙 #F2A33C。
     外圈 r=158 / 线宽 24；8 根刻度宽 8，外端统一 r=136（与圈内沿留 10）；
     指针 225° / 长 96 / 宽 16；轴心 r=26 / 内孔 r=10。
     16–32px 由脚本用简化版（粗圈、4 刻度）派生，见 design/logo/gauge/。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="88" fill="#1A2125"/>
  <circle cx="256" cy="256" r="158" fill="none" stroke="#C9D3D9" stroke-width="24"/>
  <g stroke="#C9D3D9" stroke-width="8" stroke-linecap="butt">
    <line x1="256" y1="116" x2="256" y2="136"/>
    <line x1="256" y1="116" x2="256" y2="136" transform="rotate(45 256 256)"/>
    <line x1="256" y1="116" x2="256" y2="136" transform="rotate(90 256 256)"/>
    <line x1="256" y1="116" x2="256" y2="136" transform="rotate(135 256 256)"/>
    <line x1="256" y1="116" x2="256" y2="136" transform="rotate(180 256 256)"/>
    <line x1="256" y1="116" x2="256" y2="136" transform="rotate(225 256 256)"/>
    <line x1="256" y1="116" x2="256" y2="136" transform="rotate(270 256 256)"/>
    <line x1="256" y1="116" x2="256" y2="136" transform="rotate(315 256 256)"/>
  </g>
  <path d="M256 256 L188.1 188.1" stroke="#F2A33C" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="26" fill="#C9D3D9"/>
  <circle cx="256" cy="256" r="10" fill="#1A2125"/>
</svg>
