<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 状态栏色：默认取画布白（--ui-background = #ffffff）。
         原值 #0e2228 是**改造前**深青 L 形外壳的颜色，外壳换成 shadcn 浅色侧栏后
         就该一起换掉 —— 否则手机 PWA 的状态栏还留着一道深青，与整页浅色对不上。
         切到深色主题时由 platform/theme.ts 改写这里的 content（画布深色）。
         ⚠️ 这条 meta 只管**顶部状态栏**。底部系统导航栏从 Chrome 156 起改由
         manifest 的 theme_color 画，而 manifest 是静态文件、没有深色变体，
         写死白色会让深色用户看到一根白杠。所以 manifest 里刻意不写 theme_color，
         把底栏交回系统默认（跟随手机深浅色）。 -->
    <meta name="theme-color" content="#ffffff" />
    <!-- color-scheme 交给 CSS 的 :root / [data-theme=dark] 决定：
         浅色时写 light（原生控件不被系统暗色染黑），深色时写 dark。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="昼夜" />
    <meta name="description" content="个人倒班记录工具：班序固定，成员自定义" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>月度概览</title>
    <script>
      /*
       * 首帧之前先把主题定下来，否则深色用户会先看到一帧白底再跳暗色。
       * 这段脚本刻意写成不依赖任何模块的原生代码 —— 它跑在 React 挂载之前。
       * 存储键与 platform/theme.ts 里的 STORAGE_KEYS.theme 一致。
       */
      (function () {
        try {
          var pref = localStorage.getItem('shift-schedule:local:theme:v1') || 'light';
          var dark = pref === 'dark'
            || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) root.classList.add('dark');
          /* 无边框窗口没有系统标题栏，首帧底色由页面自己给；
             不写这一行深色用户会先看到窗口 backgroundColor 的一帧白 */
          root.style.backgroundColor = dark ? '#181818' : '#ffffff';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#181818' : '#ffffff');
          /* 壳里同步窗口主题：不能等 React 挂载，否则深色用户会先看到
             一帧浅色原生控件。静态版没有 __TAURI__，这段直接跳过；
             老版本 exe 没有这个命令时 Promise 会 reject，被 catch 吞掉。 */
          var tauri = window.__TAURI__;
          if (tauri && tauri.core && tauri.core.invoke) {
            tauri.core.invoke('set_window_theme', { dark: dark }).catch(function () {});
          }
        } catch (e) {
          /* 隐私模式下 localStorage 可能抛异常：默认浅色，不影响后续 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
